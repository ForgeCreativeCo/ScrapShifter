<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrap Shifter Prototype</title>
<style>
  :root { --bg:#1d1b18; --panel:#2a2723; --text:#e9e4d8; --muted:#a59f92; --border:#4a453d; --accent:#ef9f27; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }
  #bar { position:relative; z-index:11; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  button { background:transparent; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font:inherit; font-size:14px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  select { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font:inherit; font-size:14px; cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); }
  kbd { font-size:11px; color:var(--muted); margin-left:6px; }
  #st { font-size:14px; color:var(--muted); margin-left:8px; }
  #tune { position:fixed; top:64px; right:12px; width:270px; max-height:calc(100% - 80px); overflow:auto; background:rgba(42,39,35,.94); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13px; display:none; z-index:5; }
  #tune.open { display:block; }
  #tune .tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  #tune .tabs button { padding:4px 8px; font-size:12px; border-radius:6px; }
  #tune h4 { margin:10px 0 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  #tune h4:first-child { margin-top:0; }
  #tune label { display:grid; grid-template-columns:1fr 44px; gap:2px 8px; align-items:center; margin:5px 0; color:var(--muted); }
  #tune label b { font-weight:400; color:var(--text); text-align:right; font-variant-numeric:tabular-nums; }
  #tune input { grid-column:1 / -1; width:100%; accent-color:var(--accent); margin:0; }
  #tune .row { display:flex; gap:6px; margin-top:10px; }
  #tune .row button { flex:1; padding:6px 8px; font-size:13px; }
  #hud { position:fixed; left:16px; bottom:16px; display:flex; gap:10px; align-items:center; pointer-events:none; z-index:4; }
  #hud .pill { background:rgba(29,27,24,.82); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; display:flex; align-items:center; gap:8px; }
  #hud .lbl { color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  #hpBar { width:150px; height:8px; background:#3a352e; border-radius:4px; overflow:hidden; }
  #hpFill { height:100%; width:100%; background:#8fae5a; transition:width .15s, background .3s; }
  #heatBar { width:90px; height:8px; background:#3a352e; border-radius:4px; overflow:hidden; }
  #heatFill { height:100%; width:0; background:#c9b48a; }
  #hpNum { min-width:26px; text-align:right; font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; top:96px; transform:translateX(-50%); background:rgba(29,27,24,.88); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:4; white-space:nowrap; }
  #toast.show { opacity:1; }
  #hurt { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, rgba(160,20,10,0) 45%, rgba(160,20,10,.55) 100%); opacity:0; z-index:3; }
  #ebars { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:2; }
  .ebar { position:absolute; width:46px; height:5px; margin-left:-23px; background:rgba(20,18,15,.75); border:1px solid rgba(0,0,0,.5); border-radius:3px; overflow:hidden; }
  .ebar i { display:block; height:100%; background:#d8553a; }
  /* mission HUD: objective panel, world markers, briefing/garage overlay (js/mission.js) */
  #obj { position:fixed; left:16px; top:72px; max-width:min(380px, calc(100% - 32px)); background:rgba(29,27,24,.82); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:8px 12px; pointer-events:none; z-index:4; }
  #obj .ot { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  #objT { font-size:14px; margin-top:2px; }
  #objS { font-size:12px; color:var(--muted); margin-top:3px; }
  #objS:empty { display:none; }
  #marks { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:2; }
  .mk { position:absolute; transform:translate(-50%,-50%); display:none; text-align:center; font-size:11px; letter-spacing:.05em; text-transform:uppercase; text-shadow:0 1px 2px #000; white-space:nowrap; }
  .mk .br { display:block; width:26px; height:26px; margin:0 auto; border:2px solid currentColor; border-radius:3px; box-shadow:0 0 6px rgba(0,0,0,.6); }
  .mk .ar { display:none; width:0; height:0; margin:0 auto; border-left:14px solid currentColor; border-top:8px solid transparent; border-bottom:8px solid transparent; filter:drop-shadow(0 0 2px #000); }
  .mk.off .br { display:none; } .mk.off .ar { display:block; }
  .mk span { display:block; margin-top:3px; padding:1px 6px; background:rgba(0,0,0,.5); border-radius:3px; color:#f2ede2; }
  .mk b { display:block; width:44px; height:4px; margin:3px auto 0; background:rgba(0,0,0,.55); border-radius:2px; overflow:hidden; }
  .mk u { display:block; height:100%; background:currentColor; }
  .mk.nest { color:#ff5a3a; } .mk.truck { color:#6fe08a; } .mk.ext { color:#22e6ff; } .mk.warn { color:#ffc93a; }
  /* drone view (js/drone.js): scanlines, vignette, static near max range; laser readout and rig tag */
  #dview { position:fixed; inset:0; display:none; pointer-events:none; z-index:1; background:repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px); box-shadow:inset 0 0 140px rgba(0,0,0,.5); }
  #dvStatic { position:absolute; inset:0; opacity:0; background-size:192px 192px; mix-blend-mode:screen; image-rendering:pixelated; }
  .dvTop { position:absolute; left:50%; top:30px; transform:translateX(-50%); font-size:12px; letter-spacing:.06em; color:#f2ede2; text-shadow:0 1px 2px #000; white-space:nowrap; }
  .dvTop b { color:#ff6a4a; letter-spacing:.12em; }
  #dvWarn { position:absolute; left:50%; bottom:60px; transform:translateX(-50%); font-size:14px; letter-spacing:.06em; color:#ffc93a; text-shadow:0 1px 3px #000; white-space:nowrap; }
  #dvWarn.hot { color:#ff4a3a; animation:dvBlink .5s steps(2) infinite; }
  @keyframes dvBlink { 50% { opacity:.35; } }
  #ltag, #rigTag { position:fixed; display:none; transform:translate(14px,-50%); pointer-events:none; z-index:2; font-size:11px; letter-spacing:.05em; padding:1px 6px; border-radius:3px; background:rgba(0,0,0,.55); color:#ffd9cf; white-space:nowrap; }
  #ltag.bad { color:#bdbdbd; }
  #rigTag { transform:translate(-50%,-100%); color:#6fe08a; border:1px solid rgba(111,224,138,.5); }
  #rigTag.hot { color:#ff5a3a; border-color:#ff5a3a; }
  #ovl { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(15,13,11,.74); z-index:10; }
  #ovl.show { display:flex; }
  #ovl .card { width:100%; max-width:580px; max-height:100%; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px 22px; }
  #ovl h1 { margin:0 0 8px; font-size:22px; letter-spacing:.03em; color:var(--accent); }
  #ovl p { margin:0 0 12px; font-size:14px; line-height:1.55; color:var(--muted); }
  #ovl p b { color:var(--text); font-weight:600; }
  #ovlStats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  #ovlStats:empty { display:none; }
  #ovlStats div { flex:1; min-width:96px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--muted); }
  #ovlStats b { display:block; font-size:20px; color:var(--text); font-variant-numeric:tabular-nums; }
  #ovl h3 { display:flex; justify-content:space-between; align-items:baseline; margin:6px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  #ovl h3 span { font-size:13px; letter-spacing:0; text-transform:none; color:var(--muted); }
  #ovl h3 span b { color:var(--text); font-variant-numeric:tabular-nums; }
  .up { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--border); }
  .up b { display:block; font-size:14px; font-weight:600; } .up small { font-size:12px; color:var(--muted); }
  .pips { display:flex; gap:3px; } .pips i { width:9px; height:9px; border-radius:2px; background:#3a352e; } .pips i.on { background:var(--accent); }
  .up button { min-width:92px; padding:6px 10px; font-size:13px; }
  .up button:disabled { opacity:.4; cursor:default; border-color:var(--border); }
  #deploy { width:100%; margin-top:14px; padding:10px; font-size:15px; border-color:var(--accent); color:var(--accent); }
  @media (max-width:520px){ .up { grid-template-columns:1fr auto; } .pips { grid-column:1; } }
  #c { flex:1; width:100%; display:block; touch-action:none; cursor:crosshair; background:#9C9384; }
</style>
</head>
<body>
<div id="bar">
  <button data-m="0" class="on">Buggy<kbd>1</kbd></button>
  <button data-m="1">Artillery<kbd>2</kbd></button>
  <button data-m="2">Mech<kbd>3</kbd></button>
  <button id="fire">Fire<kbd>Space</kbd></button>
  <button id="rst">Restart run<kbd>R</kbd></button>
  <button id="snd"><span>Sound on</span><kbd>M</kbd></button>
  <button id="tuneBtn">Tune<kbd>T</kbd></button>
  <select id="mapSel" title="Map"></select>
  <select id="gfxSel" title="Graphics"><option value="high">Graphics: High</option><option value="medium">Graphics: Medium</option><option value="low">Graphics: Low</option></select>
  <span id="st">Loading 3D view…</span>
</div>
<div id="tune"></div>
<div id="hud"><div class="pill"><span class="lbl">Hull</span><div id="hpBar"><div id="hpFill"></div></div><span id="hpNum">100</span></div><div class="pill" id="heatPill" style="display:none"><span class="lbl">Heat</span><div id="heatBar"><div id="heatFill"></div></div></div><div class="pill"><span class="lbl">Kills</span><span id="kills">0</span></div><div class="pill"><span class="lbl">Scrap</span><span id="scrapN">0</span></div></div>
<div id="obj"><div class="ot">Objective</div><div id="objT"></div><div id="objS"></div></div>
<div id="marks"></div>
<div id="dview"><div id="dvStatic"></div><div class="dvTop"><b>SPOTTER</b> <span id="dvInfo"></span></div><div id="dvWarn"></div></div>
<div id="ltag"></div><div id="rigTag"></div>
<div id="ovl"><div class="card"><h1 id="ovlT">Scrap Shifter</h1><p id="ovlSub"></p><div id="ovlStats"></div>
  <h3>Garage <span>Banked scrap: <b id="bank">0</b></span></h3><div id="ups"></div><button id="deploy">Deploy<kbd>Enter</kbd></button></div></div>
<div id="toast"></div><div id="hurt"></div><div id="ebars"></div>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- post-processing + geometry helpers (three r128 examples, non-module builds) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
// Report load/runtime errors in the status bar (each js/ file runs on its own, so there is no single try/catch).
window.addEventListener('error',e=>{const s=document.getElementById('st');if(s)s.textContent='Something broke: '+e.message+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'')});
</script>
<script src="js/core.js"></script>
<script src="js/townplan.js"></script>
<script src="js/maps.js"></script>
<script src="js/render.js"></script>
<script src="js/sfxdata.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/props.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/effects.js"></script>
<script src="js/structures.js"></script>
<script src="js/buildings.js"></script>
<script src="js/cars.js"></script>
<script src="js/fire.js"></script>
<script src="js/nav.js"></script>
<script src="js/camera.js"></script>
<script src="js/drive.js"></script>
<script src="js/mech.js"></script>
<script src="js/aim.js"></script>
<script src="js/drone.js"></script>
<script src="js/turrets.js"></script>
<script src="js/combat.js"></script>
<script src="js/swarm.js"></script>
<script src="js/mission.js"></script>
<script src="js/main.js"></script>
<script>
// A missing js/ file fails silently (no error event), so check that the last one ran.
window.addEventListener('load',()=>{if(typeof loop==='undefined')document.getElementById('st').textContent='Could not load the js/ files. Keep index.html next to its js/ folder (or run: node serve.js).'});
</script>
</body>
</html>
